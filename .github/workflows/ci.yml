name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Unit tests (AI, voices and network mocked)
        run: uv run --extra audio python -m unittest discover -s tests -v
      - name: Fresh install, every flow on a fake AI
        run: python3 tools/fresh_install_check.py
