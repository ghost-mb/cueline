[project]
name = "cueline"
version = "0.1.0"
description = "An open-source NotebookLM for creators: follow channels, blogs and podcasts; get cited answers, posts, scripts, pages, podcasts and agent skills. Runs on your computer."
keywords = ["notebooklm", "rag", "citations", "youtube", "rss", "podcasts", "content-creation", "agent-skills", "local-first"]
classifiers = [
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"  # the audio extra (onnxruntime) has wheels for 3.11-3.14 only
dependencies = [
    "flask>=3.0",
    "yt-dlp",
    "youtube-transcript-api>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "defusedxml>=0.7",
    "anthropic",
    "openai",
]

[project.optional-dependencies]
# Local speech-to-text and podcast voices (~400 MB)
audio = [
    "faster-whisper>=1.2",
    "av<16",  # faster-whisper 1.2 passes metadata_errors, removed in av 16
    "kokoro-onnx>=0.6",  # voice model files download to ~/.cueline/models/kokoro on first use
    "numpy",
]

# Read scanned PDFs on this computer (~130 MB)
ocr = [
    "rapidocr>=3",
    "onnxruntime",
    "pypdfium2",
]

[project.scripts]
cueline = "cueline.cli:main"

[project.urls]
Homepage = "https://github.com/ghost-mb/cueline"
Issues = "https://github.com/ghost-mb/cueline/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
